[package]
name = "iu"
version = "0.1.0"
edition = "2024"

[features]
default = ["default_font"]
picking = ["bevy/bevy_picking"]
#text = []
default_font = ["bevy/default_font"]

#svg = []    # fix
#lottie = [] # fix

[dependencies]
bevy = { version = "0.19.0", default-features = false, features = [
    "default_app",
    "2d_bevy_render",
    "ui_bevy_render",
] }
vello = "0.9.0"
thiserror = "2.0.18"
tracing = "0.1.44"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
parley = { version = "0.10.0", features = ["system"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
parley = { version = "0.10.0", default-features = false, features = ["std"] }
