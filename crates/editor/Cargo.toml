[package]
name = "editor"
version = "0.1.0"
edition = "2024"

[dependencies]
reui = { version = "0.3.0", features = ["bevy"] }

bitflags = "2"
slotmap = "1"
arrayvec = "0.7"

async-executor = "1.4"
pollster = "0.3"
egui = { version = "0.23.0", features = ["bytemuck"] }
winit = "0.28"
webbrowser = "0.8.0"

bytemuck = "1.9"

wgpu = "0.17"
naga = { version = "0.13", features = ["wgsl-in", "wgsl-out"] }
downcast-rs = "1.2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

ahash = "0.8.0"
sublime_fuzzy = "0.7.0"

bevy = "0.12"
#bevy_math = "0.12"
bevy_egui = "0.23"
egui-gizmo = "0.12"

smallvec = "1"

anyhow = "1.0"
thiserror = "1.0"
serde = "1"
uuid = { version = "1", features = ["v4", "serde"] }
ron = "0.8"

image = { version = "0.24", default-features = false }
once_cell = "1.16"
pretty-type-name = "1.0"

futures-lite = "*"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = "3.2"
thread_local = "1.1.0"
